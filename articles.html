<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עולם הכתבות שלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
        body {
            font-family: 'Heebo', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-slate-100 sticky top-0 z-50 backdrop-blur-md bg-white/90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl text-blue-600"><i class="fa-solid fa-newspaper"></i></span>
                <h1 class="text-xl font-black tracking-tight text-slate-900">חדשות <span class="text-blue-600">היום</span></h1>
            </div>
            <div class="text-sm text-slate-500 font-medium" id="current-date"></div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div class="mb-10 text-center md:text-right">
            <h2 class="text-3xl font-extrabold text-slate-900 sm:text-4xl">הכתבות האחרונות שלנו</h2>
            <p class="mt-3 text-lg text-slate-500 max-w-2xl">כל מה שמעניין, חם ומעודכן במקום אחד.</p>
        </div>

        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-slate-500 font-medium">טוען כתבות עבורך...</p>
        </div>

        <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-800 rounded-2xl p-6 text-center my-10 max-w-lg mx-auto">
            <span class="text-3xl block mb-2">⚠️</span>
            <h3 class="font-bold text-lg mb-1">אופס, משהו השתבש</h3>
            <p class="text-sm text-red-600 mb-4">לא הצלחנו למשוך את הכתבות מהשרת. ודא שה-API שלך דולק בפורט 3000.</p>
            <button onclick="fetchArticles()" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-lg transition-all text-sm">ניסיון חוזר</button>
        </div>

        <div id="articles-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            </div>

    </main>

    <footer class="bg-white border-t border-slate-100 py-6 mt-12 text-center text-slate-400 text-sm">
        <p>© 2026 כל הזכויות שמורות לפורטל החדשות שלך</p>
    </footer>

    <script>
        // הצגת תאריך נוכחי בראש העמוד
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('he-IL', options);

        const API_URL = 'http://localhost:3000/articles';

        // פונקציה לעיצוב תאריך הכתבה בצורה קריאה
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('he-IL', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        async function fetchArticles() {
            const loader = document.getElementById('loader');
            const errorMessage = document.getElementById('error-message');
            const container = document.getElementById('articles-container');

            // איפוס מצבים
            loader.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            container.classList.add('hidden');
            container.innerHTML = '';

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('רשת לא זמינה');
                
                const articles = await response.json();
                
                if (articles.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-12">אין כתבות להצגה כרגע.</div>`;
                } else {
                    articles.forEach(article => {
                        const card = createArticleCard(article);
                        container.appendChild(card);
                    });
                }

                // הצגת התוכן והסתרת הטעינה
                loader.classList.add('hidden');
                container.classList.remove('hidden');

            } catch (error) {
                console.error("שגיאה במשיכת הנתונים:", error);
                loader.classList.add('hidden');
                errorMessage.classList.remove('hidden');
            }
        }

        // יצירת כרטיסיית כתבה מעוצבת
        function createArticleCard(article) {
            const div = document.createElement('article');
            div.className = "bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-slate-100 flex flex-col h-full";

            // טיפול במקרה ואין תמונה זמינה
            const imgUrl = article.imgUrl || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600';

            div.innerHTML = `
                <div class="relative aspect-video overflow-hidden bg-slate-100">
                    <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                         src="${imgUrl}" 
                         alt="${article.headline}"
                         onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600'">
                    <span class="absolute top-4 right-4 bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-md">
                        חדש
                    </span>
                </div>

                <div class="p-6 flex flex-col flex-grow">
                    <div class="flex items-center gap-2 text-xs text-slate-400 mb-3 font-medium">
                        <i class="fa-regular fa-calendar"></i>
                        <span>${formatDate(article.publishDate || article.addedTime)}</span>
                    </div>

                    <h3 class="text-xl font-bold text-slate-900 leading-snug mb-2 line-clamp-2 hover:text-blue-600 transition-colors">
                        <a href="#">${article.headline}</a>
                    </h3>

                    <p class="text-slate-600 text-sm leading-relaxed mb-6 line-clamp-3">
                        ${article.description}
                    </p>

                    <div class="mt-auto pt-4 border-t border-slate-50 flex items-center justify-between">
                        <button class="text-blue-600 hover:text-blue-800 font-bold text-sm inline-flex items-center gap-1 group">
                            לקריאת הכתבה
                            <i class="fa-solid fa-arrow-left text-xs transform group-hover:-translate-x-1 transition-transform"></i>
                        </button>
                    </div>
                </div>
            `;
            return div;
        }

        // הרצת הפונקציה בטעינת הדף
        document.addEventListener("DOMContentLoaded", fetchArticles);
    </script>
</body>
</html>
